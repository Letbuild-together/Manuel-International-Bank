@tailwind base;
@tailwind components;
@tailwind utilities;

:root {
  --background: #f7f9fc;
  --foreground: #0f172a;
}

html {
  scroll-behavior: smooth;
}

body {
  background: linear-gradient(180deg, #f7fafc 0%, #eef8fe 100%);
  color: var(--foreground);
  font-family: Arial, Helvetica, sans-serif;
}

* {
  box-sizing: border-box;
}

input,
button,
select,
textarea {
  font: inherit;
}
